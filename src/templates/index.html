<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Tickets</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div id="error-banner" class="banner banner-error hidden" role="alert"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 6v12" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
        </svg>
      </span>
      <div>
        <h1>Support Tickets</h1>
        <p class="brand-subtitle">Internal ticket tracker, backed by Lakebase</p>
      </div>
    </div>
    <button id="new-ticket-btn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      New Ticket
    </button>
  </header>

  <section id="stats-strip" class="stats-strip" aria-label="Ticket statistics"></section>

  <main class="app-main">
    <section class="ticket-panel">
      <div class="toolbar" role="group" aria-label="Filter tickets by status">
        <button type="button" class="filter-pill active" data-status="">All</button>
        <button type="button" class="filter-pill" data-status="open">Open</button>
        <button type="button" class="filter-pill" data-status="in_progress">In Progress</button>
        <button type="button" class="filter-pill" data-status="resolved">Resolved</button>
      </div>
      <ul id="ticket-list" class="ticket-list"></ul>
    </section>

    <section id="detail-pane" class="detail-pane">
      <div class="empty-state">
        <span class="empty-icon" aria-hidden="true">👈</span>
        <p>Select a ticket to view its messages.</p>
      </div>
    </section>
  </main>

  <!-- New ticket modal -->
  <div id="new-ticket-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-ticket-title">
      <h2 id="new-ticket-title">New Ticket</h2>
      <form id="new-ticket-form">
        <label for="ticket-title">Title</label>
        <input type="text" id="ticket-title" name="title" maxlength="200" placeholder="e.g. Checkout page returns a 500" required />

        <div class="field-row">
          <div>
            <label for="ticket-priority">Priority</label>
            <select id="ticket-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div>
            <label for="ticket-category">Category</label>
            <select id="ticket-category" name="category">
              <option value="bug">Bug</option>
              <option value="feature_request">Feature Request</option>
              <option value="question">Question</option>
              <option value="other" selected>Other</option>
            </select>
          </div>
        </div>

        <p id="new-ticket-error" class="form-error hidden"></p>

        <div class="modal-actions">
          <button type="button" id="new-ticket-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div id="delete-confirm-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
      <h2 id="delete-confirm-title">Delete this ticket?</h2>
      <p id="delete-confirm-body"></p>
      <div class="modal-actions">
        <button type="button" id="delete-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="delete-confirm" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
